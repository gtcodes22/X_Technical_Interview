# Continuous integration. Runs on every push and pull request to main.
# The Netlify build also runs the TypeScript checks before deploying; this workflow adds the
# Python side, a data drift check and a secret scan, and shows results on PRs before merge.
# No secrets needed: the LLM is mocked in all tests. See docs/OPERATIONS.md §2.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Unit tests (cleaning rules, shared phone fixtures)
        run: python -m pytest -q scripts/tests
      - name: Re-run ingest (stops if any SQL data-quality check fails)
        run: python scripts/ingest.py
      - name: Drift check — committed data/generated/ must match a fresh ingest
        run: |
          # manifest.json is excluded because it contains the generation timestamp.
          if ! git diff --exit-code --stat -- data/generated ':(exclude)data/generated/manifest.json'; then
            echo "::error::data/generated/ is out of date. Run 'python scripts/ingest.py' and commit the result."
            exit 1
          fi

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
